<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONClass - Login</title>
    <!-- Importação do Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nosso arquivo CSS customizado -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    
    <main class="card shadow-sm p-4 login-card">
        <div class="text-center mb-4">
            <h1 class="h3 mb-3 fw-bold text-primary">ONClass</h1>
            <p class="text-muted">Controle de Presença Inteligente</p>
        </div>
        
        <!-- O formulário apontará para a futura rota /login do Flask -->
        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="identificacao" class="form-label">Matrícula ou E-mail</label>
                <input type="text" class="form-control" id="identificacao" name="identificacao" required>
            </div>
            
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            
            <div class="mb-3">
                <label for="tipo_usuario" class="form-label">Entrar como:</label>
                <select class="form-select" id="tipo_usuario" name="tipo_usuario">
                    <option value="aluno">Aluno</option>
                    <option value="professor">Professor</option>
                </select>
            </div>
            
            <button class="btn btn-primary w-100 py-2 mt-2" type="submit">Acessar Sistema</button>
        </form>
    </main>

</body>
</html>

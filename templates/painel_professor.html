<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONClass - Painel do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">ONClass - Painel do Docente</span>
        <a href="/login" class="btn btn-outline-light btn-sm">Sair</a>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h2 class="h4 mb-3">Gerenciamento de Chamada</h2>
                    <p class="text-muted">Selecione a turma para abrir uma sessão de presença com QR Code dinâmico.</p>
                    
                    <!-- Formulário para iniciar a sessão -->
                    <form action="/professor/iniciar_sessao" method="POST" class="mb-4">
                        <input type="hidden" name="professor_id" value="{{ professor_id }}">
                        <div class="mb-3">
                            <label for="turma_id" class="form-label">Disciplina / Turma</label>
                            <select class="form-select" id="turma_id" name="turma_id" required>
                                {% for turma in turmas %}
                                    <option value="{{ turma.id }}">{{ turma.nome_disciplina }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Iniciar Chamada</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

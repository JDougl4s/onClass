<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONClass - Chamada em Andamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Biblioteca leve para desenhar o QR Code na tela -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-dark text-white d-flex flex-column align-items-center justify-content-center vh-100">

    <div class="text-center">
        <h1 class="display-5 fw-bold mb-2">Chamada Ativa: {{ disciplina }}</h1>
        <p class="text-secondary mb-4">Escaneie o código abaixo com o aplicativo do aluno. O token expira em segundos.</p>
        
        <!-- Caixa Branca onde o QR Code será renderizado -->
        <div class="bg-white p-4 rounded shadow d-inline-block mb-3">
            <div id="qrcode"></div>
        </div>

        <div class="mt-2">
            <span class="badge bg-warning text-dark fs-6" id="timer">Renovando em 10s...</span>
        </div>

        <div class="mt-4">
            <a href="/login" class="btn btn-outline-danger btn-sm">Encerrar Sessão</a>
        </div>
    </div>

    <script>
        const sessaoId = "{{ sessao_id }}";
        let qrcodeDiv = document.getElementById("qrcode");
        
        // Instancia o gerador de QR Code visual
        let qrcode = new QRCode(qrcodeDiv, {
            width: 256,
            height: 256
        });

        function atualizarToken() {
            fetch(`/api/token/${sessaoId}`)
                .then(response => response.json())
                .then(data => {
                    // Atualiza o desenho do QR Code com a string encriptada recebida do Python
                    qrcode.makeCode(data.token);
                })
                .catch(err => console.error("Erro ao buscar token:", err));
        }

        // Executa imediatamente ao carregar a página
        atualizarToken();

        // Configura o ciclo exato de renovação a cada 10 segundos (10000 milissegundos)
        setInterval(atualizarToken, 10000);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONClass - Portal do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand mb-0 h1">ONClass - Portal do Estudante</span>
        <a href="/login" class="btn btn-outline-light btn-sm">Sair</a>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4 text-center">
                    <h2 class="h4 mb-3">Registrar Presença</h2>
                    <p class="text-muted">Insira o código gerado na tela do professor ou escaneie o QR Code da aula ativa.</p>
                    
                    <!-- Formulário de envio do Token -->
                    <form action="/aluno/registrar_presenca" method="POST">
                        <input type="hidden" name="aluno_id" value="{{ aluno_id }}">
                        
                        <div class="mb-3 text-start">
                            <label for="token_recebido" class="form-label">Token da Sessão (QR Code)</label>
                            <input type="text" class="form-control font-monospace" id="token_recebido" name="token_recebido" placeholder="Cole o hash do QR Code aqui" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">Confirmar Presença</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
